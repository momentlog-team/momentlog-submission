server:
  port: 8090

spring:
  application:
    name: momentlog-server
  datasource:
    # 초안: 파일 H2. 운영 DB는 팀에서 정한 뒤 바꾼다.
    url: jdbc:h2:file:./data/momentlog;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

springdoc:
  packages-to-scan: team.momentlog.server
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /api-docs/json
