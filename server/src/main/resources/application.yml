server:
  port: 8090

spring:
  application:
    name: momentlog-server
  datasource:
    # 초안: 파일 H2. 운영 DB는 팀에서 정한 뒤 바꾼다.
    url: jdbc:h2:file:./data/momentlog;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# 보관 기간(ISO-8601). 2026-11-02 결정: 공유 본문·PDF 30일, 문서 지문·봉인 3년, 확인 이력 90일
momentlog:
  share:
    ttl: P30D
    # QR 토큰을 공유 ID에서 다시 만드는 HMAC 키. 비우면 실행마다 새 키(재시작 뒤엔 같은 내용이어도 새 공유를 만든다)
    token-secret: ${MOMENTLOG_SHARE_TOKEN_SECRET:}
  retention:
    proof-ttl: P1095D
    verify-log-ttl: P90D
    cron: "0 30 4 * * *"

springdoc:
  packages-to-scan: team.momentlog.server
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /api-docs/json
